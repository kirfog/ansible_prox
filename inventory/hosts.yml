---
all:
  children:
    hypervisor:
      hosts:
        pve-node-01.local:
          ansible_host: 192.168.88.222

    debian:
      hosts:
        deb[201:202].realm.lan:
          ansible_host: "192.168.88.{{ inventory_hostname | regex_search('[0-9]+') }}"
          vmid: "{{ inventory_hostname | regex_replace('[^0-9]') | int }}"
          pve_target_host: "pve-node-01.local"
          # vm_recreate: true

        # deb[231:234].realm.lan:
        #   ansible_host: "192.168.88.{{ inventory_hostname | regex_search('[0-9]+') }}"
        #   vmid: "{{ inventory_hostname | regex_replace('[^0-9]') | int }}"
        #   pve_target_host: "pve-node-01.local"
        #   # vm_recreate: true

    rocky:
      hosts:
        roc[211:212].realm.lan:
          ansible_host: "192.168.88.{{ inventory_hostname | regex_search('[0-9]+') }}"
          vmid: "{{ inventory_hostname | regex_replace('[^0-9]') | int }}"
          pve_target_host: "pve-node-01.local"
          # vm_recreate: true


    vms:
      children:
          debian:
          rocky:

    freeipa:
      children:
        ipamaster:
          hosts:
            roc211.realm.lan: {}
        ipareplicas:
          hosts:
            roc212.realm.lan: {}

      vars:
        ipaadmin_password: "YourStrongAdminPassword123"
        ipadm_password: "YourStrongDirectoryManagerPassword123"

        ipaserver_domain: "realm.lan"
        ipaserver_realm: "REALM.LAN"
        ipaserver_setup_ca: true
        ipaserver_setup_dns: true
        ipaserver_auto_forwarders: true

        ipareplica_setup_ca: true
        ipareplica_setup_dns: true
        ipareplica_auto_forwarders: true
        ipareplica_force_join: true

        ipadomain: "realm.lan"
        ipaclient_force_join: true
        ipaclient_allow_repair: true

        ipaservers: "{{ groups['ipamaster'] }}"
        ipareplicas: "{{ groups['ipareplicas'] }}"
        ipaclient_servers: "{{ groups['ipamaster'] }}"


    web:
      hosts:
        deb201.realm.lan: {}

    db:
      vars:
        pg_version: "18"
        pg_replicator_user: "replicator"
        pg_replicator_password: "replicatorpassword"

      children:
        master:
          hosts:
            deb201.realm.lan: {}
        replica:
            hosts:
              deb202.realm.lan: {}

    client:
      hosts:
        deb202.realm.lan:
          vm_disk_size: "20G"
          users:
            uso:
              password: 12345777
            sao:
              password: 12345888
              sudo: yes

    kubernetes:
      children:
        masters:
          hosts:
            deb231.realm.lan: {}
            deb232.realm.lan: {}
            deb233.realm.lan: {}
        workers:
          hosts:
            deb231.realm.lan: {}
            deb232.realm.lan: {}
            deb233.realm.lan: {}
            deb234.realm.lan: {}


    keycloak:
      hosts:
        deb203.realm.lan:
